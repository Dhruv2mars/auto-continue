name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate tag and package
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
          bun test
          npm pack --dry-run

  create_release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes

  build_upload:
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pack and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(npm pack --silent)
          sha256sum "$archive" > "$archive.sha256"
          gh release upload "${GITHUB_REF_NAME}" "$archive" "$archive.sha256" --repo "${GITHUB_REPOSITORY}" --clobber

  publish_npm:
    needs: build_upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish with provenance
        run: |
          remote_version=$(npm view auto-continue version 2>/dev/null || true)
          local_version=$(node -p "require('./package.json').version")
          if [ "$remote_version" = "$local_version" ]; then
            echo "skip: auto-continue@$local_version already exists"
            exit 0
          fi
          npm publish --provenance --access public
